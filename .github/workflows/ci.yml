name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      - name: Test
        run: |
          ctest \
            --test-dir build \
            --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure with TSan
        run: |
          cmake \
            -S . \
            -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TSAN=ON

      - name: Build
        run: |
          cmake \
            --build build-tsan \
            --parallel

      - name: Test with TSan
        run: |
          setarch "$(uname -m)" -R \
            ctest \
              --test-dir build-tsan \
              --output-on-failure