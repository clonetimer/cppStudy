name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: |
          cmake \
            --build build \
            --parallel

      - name: Test
        run: |
          ctest \
            --test-dir build \
            --output-on-failure

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON

      - name: Build
        run: |
          cmake \
            --build build-sanitize \
            --parallel

      - name: Test
        run: |
          ctest \
            --test-dir build-sanitize \
            --output-on-failure